import java.time.LocalDateTime
import java.time.Month
import java.time.temporal.ChronoUnit

plugins {
	id "com.android.application"
	id "org.jetbrains.kotlin.android"
	id "org.jetbrains.kotlin.plugin.compose"
}

android {
	namespace = "su.xash.cs16client"
	ndkVersion = "28.2.13676358"
	compileSdk = 36

	defaultConfig {
		applicationId = "su.xash.cs16client"
		versionName = "1.35-" + getGitHash()
		versionCode = getBuildNum()
		minSdk = 21
		targetSdk = 36
	}

	// One APK per architecture. The split set is also what AGP builds native
	// libraries for, so ndk.abiFilters must stay unset - AGP rejects a project
	// that sets both.
	splits {
		abi {
			enable true
			reset()
			include "armeabi-v7a", "arm64-v8a", "x86"
			universalApk false
		}
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_11
		targetCompatibility = JavaVersion.VERSION_11
	}

	kotlinOptions {
		jvmTarget = "11"
	}

	externalNativeBuild {
		cmake {
			version = "3.22.1"
			path file("../../CMakeLists.txt")
		}
	}

	lint {
		abortOnError = false
	}

	packaging {
		jniLibs {
			keepDebugSymbols.add("**/*.so")
			useLegacyPackaging = true
		}
	}

	signingConfigs {
		debug {}

		continuous {
			if (System.getenv('KEYSTORE_FILE_PATH') != null) {
				storeFile = file(System.getenv('KEYSTORE_FILE_PATH'))
				storePassword = System.getenv('KEYSTORE_PASSWORD')
				keyAlias = System.getenv('KEY_ALIAS')
				keyPassword = System.getenv('KEY_PASSWORD')
			}
		}
	}

	buildTypes {
		debug {
			debuggable = true
			applicationIdSuffix = ".test"

			proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.txt"
		}

		release {
			minifyEnabled = true
			shrinkResources = true

			proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.txt"
		}

		create("continuous") {
			initWith(getByName("release"))
			applicationIdSuffix = ".test"
			signingConfig = signingConfigs.continuous

			externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
                }
			}
		}
	}

	flavorDimensions += "version"

	productFlavors {
		create("googlePlay") {
			dimension = "version"
			applicationId = "in.celest.xash3d.cs16client"
			buildConfigField("Boolean", "IS_GOOGLE_PLAY_BUILD", "true")
		}

		create("git") {
			dimension = "version"
			buildConfigField("Boolean", "IS_GOOGLE_PLAY_BUILD", "false")
		}
	}

	buildFeatures {
		compose = true
		buildConfig = true
	}
}

dependencies {
	implementation "androidx.core:core-ktx:1.13.1"
	implementation "androidx.activity:activity-compose:1.9.2"
	implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.5"
	implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5"

	implementation platform("androidx.compose:compose-bom:2024.09.03")
	implementation "androidx.compose.ui:ui"
	implementation "androidx.compose.ui:ui-graphics"
	implementation "androidx.compose.ui:ui-tooling-preview"
	implementation "androidx.compose.material3:material3"
	implementation "androidx.compose.material:material-icons-extended"

	debugImplementation "androidx.compose.ui:ui-tooling"
}

tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
	dependsOn(tasks.matching { it.name.startsWith("configureCMake") })
}

static def getBuildNum() {
	LocalDateTime now = LocalDateTime.now()
	LocalDateTime releaseDate = LocalDateTime.of(2015, Month.OCTOBER, 29, 0, 0, 0)
	int qBuildNum = releaseDate.until(now, ChronoUnit.DAYS)
	int minuteOfDay = now.getHour() * 60 + now.getMinute()
	return qBuildNum * 10000 + minuteOfDay
}

def getGitHash() {
	Process process = new ProcessBuilder("git", "rev-parse", "--short", "HEAD")
			.directory(project.rootDir)
			.redirectErrorStream(true)
			.start()
	InputStreamReader inputStreamReader = new InputStreamReader(process.getInputStream())
	BufferedReader bufferedReader = new BufferedReader(inputStreamReader)

	return bufferedReader.getText().trim()
}